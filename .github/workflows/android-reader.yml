name: SchoolTap Android reader

on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run reader tests
        run: node --test mobile/android/tests/*.test.cjs
      - name: Build pilot APK
        run: gradle -p mobile/android :app:assembleDebug --no-daemon
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose mobile/android/app/build/outputs/apk/debug/app-debug.apk'
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolTap-Android-Reader
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
