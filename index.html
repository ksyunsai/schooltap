 const dispatchSystemBannerNotification = ({ title, body, tag, onClickFocus }) => {
 try {
 if (!('Notification' in window)) return false;
 if (Notification.permission !== 'granted') return false;
 if ('vibrate' in navigator) {
 try { navigator.vibrate([220, 100, 220]); } catch (e) {}
 }
 const svgBadge = encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#FBBF24"/><text x="64" y="88" font-size="76" text-anchor="middle">🚌</text></svg>'
 );
 const notif = new Notification(title, {
 body,
 tag: tag || 'schooltap-alert-' + Date.now(),
 renotify: true,
 requireInteraction: false,
 icon: 'data:image/svg+xml;utf8,' + svgBadge,
 badge: 'data:image/svg+xml;utf8,' + svgBadge
 });
 notif.onclick = () => {
 try {
 window.focus();
 if (typeof onClickFocus === 'function') onClickFocus();
 notif.close();
 } catch (e) {}
 };
 return true;
 } catch (e) {
 return false;
 }
 };

 const calcDistanceMeters = (lat1, lng1, lat2, lng2) => {
 if (
 typeof lat1 !== 'number' ||
 typeof lng1 !== 'number' ||
 typeof lat2 !== 'number' ||
 typeof lng2 !== 'number'
 ) {
 return null;
 }
 const toRad = (deg) => (deg * Math.PI) / 180;
 const R = 6371000;
 const dLat = toRad(lat2 - lat1);
 const dLng = toRad(lng2 - lng1);
 const a =
 Math.sin(dLat / 2) * Math.sin(dLat / 2) +
 Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
 const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
 return Math.round(R * c);
 };

 return `${meters} m`;
 };

 const safeCopyText = (text) => {
 try {
 const ta = document.createElement('textarea');
 ta.value = text;
 ta.style.position = 'fixed';
 ta.style.opacity = '0';
 document.body.appendChild(ta);
 ta.focus();
 ta.select();
 document.execCommand('copy');
 document.body.removeChild(ta);
 return true;
 } catch (e) {
 return false;
 }
 };

 const playChime = (type = 'BOARD', muted = false) => {
 if (muted) return;
 try {
 const AudioCtx = window.AudioContext || window.webkitAudioContext;
 if (!AudioCtx) return;
 const ctx = new AudioCtx();
 const now = ctx.currentTime;
 const tone = (freq, start, dur, wave = 'triangle', vol = 0.2) => {
 const osc = ctx.createOscillator();
 const gain = ctx.createGain();
 osc.type = wave;
 osc.frequency.setValueAtTime(freq, start);
 gain.gain.setValueAtTime(0.0001, start);
 gain.gain.exponentialRampToValueAtTime(vol, start + 0.015);
 gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.start(start);
 osc.stop(start + dur + 0.02);
 };
 if (type === 'BOARD') {
 tone(523.25, now, 0.1);
 tone(659.25, now + 0.08, 0.1);
 tone(783.99, now + 0.16, 0.12);
 tone(1046.5, now + 0.25, 0.25, 'sine', 0.24);
 } else if (type === 'ALIGHT') {
 tone(659.25, now, 0.08, 'sine');
 tone(783.99, now + 0.07, 0.08, 'sine');
 tone(880.0, now + 0.14, 0.08, 'sine');
 tone(1046.5, now + 0.21, 0.12);
 tone(1318.5, now + 0.3, 0.26, 'sine', 0.24);
 } else if (type === 'APPROACHING_10M') {
 tone(587.33, now, 0.09);
 tone(783.99, now + 0.09, 0.09);
 tone(987.77, now + 0.18, 0.11, 'sine');
 tone(1174.66, now + 0.28, 0.26, 'sine', 0.24);
 } else if (type === 'NO_ALIGHT_1H') {
 tone(880.0, now, 0.14, 'triangle', 0.25);
 tone(659.25, now + 0.16, 0.14, 'triangle', 0.25);
 tone(880.0, now + 0.34, 0.14, 'triangle', 0.25);
 tone(1046.5, now + 0.50, 0.28, 'sine', 0.26);
 } else {
 tone(330, now, 0.12, 'sawtooth', 0.14);
 tone(262, now + 0.13, 0.18, 'sawtooth', 0.14);
 }
 } catch (e) {}
 };

 const speakVoice = (text, lang = 'ko', muted = false) => {

 try {
 if ('speechSynthesis' in window) {
 window.speechSynthesis.cancel();
 const utter = new SpeechSynthesisUtterance(text);
 utter.lang = lang === 'en' ? 'en-US' : 'ko-KR';
 utter.rate = 1.05;
 window.speechSynthesis.speak(utter);
 }
 } catch (e) {}
 };

 const r = (params.get('role') || params.get('mode') || '').toUpperCase();

 if (r === 'READER') return 'READER';

 });

 const s = (params.get('schoolId') || '').trim().toUpperCase();
 if (s) {
 localStorage.setItem('schooltap_school_id', s);

 }
 return localStorage.getItem('schooltap_school_id') || DEFAULT_SCHOOL_ID;
 }, [params]);

 const [lang, setLang] = useState(() => {
 const pLang = params.get('lang');

 localStorage.setItem('schooltap_lang', pLang);

 }

 const subscribeBackgroundPush = useCallback(async (vapidPublicKeyOpt = '') => {
 const keyToUse = (vapidPublicKeyOpt || vapidPubKey || localStorage.getItem('schooltap_vapid_pub') || '').trim();
 if (keyToUse) {
 setVapidPubKey(keyToUse);
 localStorage.setItem('schooltap_vapid_pub', keyToUse);
 }
 if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
 try {
 const reg = swRegRef.current || (await navigator.serviceWorker.ready);
 swRegRef.current = reg;
 let sub = await reg.pushManager.getSubscription();
 if (!sub && keyToUse) {
 const padding = '='.repeat((4 - (keyToUse.length % 4)) % 4);
 const base64 = (keyToUse + padding).replace(/-/g, '+').replace(/_/g, '/');
 const rawData = window.atob(base64);
 const outputArray = new Uint8Array(rawData.length);
 for (let i = 0; i < rawData.length; ++i) {
 outputArray[i] = rawData.charCodeAt(i);
 }
 sub = await reg.pushManager.subscribe({
 userVisibleOnly: true,
 applicationServerKey: outputArray
 });
 }
 if (sub) {
 const serialized = JSON.stringify(sub);
 setPushSubJson(serialized);
 localStorage.setItem('schooltap_push_sub', serialized);
 await savePushSubscriptionToCloud(sub.toJSON ? sub.toJSON() : JSON.parse(serialized));
 return serialized;
 }
 } catch (e) {}
 return null;
 }, [vapidPubKey, savePushSubscriptionToCloud]);

 dispatchSystemBannerNotification({

 isEn

 : `💛 [${sName(matched)}] 어린이의 ${relTxt} 휴대폰으로 연결되었습니다!`
 );

 if ('Notification' in window && Notification.permission === 'default') {
 requestSystemNotificationPermission(false);
 }
 return true;
 };

 const handleManualParentSync = async () => {
 if (syncingBusy) return;
 const client = sbClientRef.current;
 if (!client) {
 showToast(
 isEn
 ? '⚠️ Cloud API Key is missing. Tap status text at top to connect.'
 : '⚠️ 클라우드 API 키가 연결되지 않았습니다. 상단 상태 문구를 눌러 키를 확인해 주세요.'
 );
 return;
 }
 if (parentLinkedCodes.length === 0) {
 showToast(
 isEn ? '⚠️ No invite code linked yet.' : '⚠️ 연결된 초대코드가 없습니다.'
 );
 return;
 }

 setSyncingBusy(true);
 showToast(isEn ? '🔄 Syncing latest student info...' : '🔄 DB에서 최신 원생 정보와 알림을 불러오는 중...');

 try {
 const mapped = await fetchFreshStudentsFromDb(client, parentLinkedCodes);
 if (!Array.isArray(mapped) || mapped.length === 0) {
 showToast(
 isEn
 ? '⚠️ Student record not found in DB.'
 : '⚠️ DB에서 해당 초대코드 원생을 찾지 못했습니다.'
 );
 setSyncingBusy(false);
 return;
 }

 const kidIds = mapped.map((m) => m.id);
 const { data: freshLogs } = await client
 .from('schooltap_ride_logs')
 .select('*')
 .in('student_id', kidIds)
 .order('tagged_at_ms', { ascending: false })
 .limit(30);

 if (Array.isArray(freshLogs)) {
 freshLogs.forEach((r) => handleIncomingRideLog(r, true));
 }

 playChime('BOARD', soundMuted);
 const activeKid = mapped.find((m) => m.id === activeStudentId) || mapped[0];
 showToast(
 isEn
 ? `✅ Synced [${sName(activeKid)}] (${freshLogs?.length || 0} logs)!`
 : `✅ [${sName(activeKid)}] 최신 정보 및 알림(${freshLogs?.length || 0}건) 동기화 완료!`
 );
 } catch (err) {
 showToast(isEn ? `❌ Sync Error: ${err.message}` : `❌ 동기화 오류: ${err.message}`);
 } finally {
 setSyncingBusy(false);
 }
 };

 const handleDisconnectParent = async () => {
 setParentLinkedCodes([]);
 localStorage.removeItem('schooltap_parent_codes');
 setPopupLog(null);

 const client = sbClientRef.current;
 if (client) {
 try {
 await fetchFreshStudentsFromDb(client, null);
 } catch (e) {}
 }

 showToast(
 isEn
 ? 'Unlinked. Enter a new invite code to connect another student.'
 : '연결이 해제되었습니다. 최신 명단을 불러왔습니다.'
 );
 };

 const linkedCodesKey = useMemo(() => parentLinkedCodes.slice().sort().join(','), [parentLinkedCodes]);

 useEffect(() => {
 if (!sbUrl || !sbKey || !window.supabase) {
 setCloudStatus('IDLE');
 sbClientRef.current = null;
 return;
 }
 setCloudStatus('CONNECTING');
 const client = window.supabase.createClient(sbUrl, sbKey);
 sbClientRef.current = client;

 let active = true;

 const bootstrapData = async () => {
 try {
 if (deviceRole === 'PARENT') {
 const codes = linkedCodesKey ? linkedCodesKey.split(',').filter(Boolean) : [];
 if (codes.length === 0) {
 const { data: previewRows, error: pingErr } = await client
 .from('schooltap_students')
 .select('*')
 .eq('school_id', schoolId)
 .order('id', { ascending: true })
 .limit(20);
 if (!active) return;
 if (pingErr) {
 setCloudStatus('ERROR');
 } else {
 setCloudStatus('CONNECTED');
 setStudents((previewRows || []).map(mapStudentFromDb));
 }
 return;
 }

 const { data: stuRows, error: stuErr } = await client
 .from('schooltap_students')
 .select('*')
 .in('invite_code', codes);

 if (!active) return;
 if (stuErr) {
 setCloudStatus('ERROR');
 return;
 }

 setCloudStatus('CONNECTED');
 const mappedKids = (stuRows || []).map(mapStudentFromDb);
 myLinkedIdsRef.current = new Set(mappedKids.map((k) => k.id));
 setStudents(mappedKids);

 if (mappedKids.length > 0) {
 const kidIds = mappedKids.map((k) => k.id);
 const { data: logRows } = await client
 .from('schooltap_ride_logs')
 .select('*')
 .in('student_id', kidIds)
 .order('tagged_at_ms', { ascending: false })
 .limit(30);

 if (active && Array.isArray(logRows)) {
 logRows.forEach((r) => handleIncomingRideLog(r, true));
 }
 }
 } else {
 const { data: stuRows, error: stuErr } = await client
 .from('schooltap_students')
 .select('*')
 .eq('school_id', schoolId)
 .order('id', { ascending: true });

 if (!active) return;
 if (stuErr) {
 setCloudStatus('ERROR');
 return;
 }

 setCloudStatus('CONNECTED');
 if (Array.isArray(stuRows) && stuRows.length > 0) {
 setStudents(stuRows.map(mapStudentFromDb));
 } else if (Array.isArray(stuRows) && stuRows.length === 0) {
 const seedRows = INITIAL_STUDENTS.map((s) => mapStudentToDb(s, schoolId));
 await client.from('schooltap_students').upsert(seedRows, { onConflict: 'id' });
 if (active) setStudents(INITIAL_STUDENTS);
 }

 const { data: logRows } = await client
 .from('schooltap_ride_logs')
 .select('*')
 .eq('school_id', schoolId)
 .order('tagged_at_ms', { ascending: false })
 .limit(30);

 if (active && Array.isArray(logRows)) {
 logRows.forEach((r) => handleIncomingRideLog(r, true));
 }
 }
 } catch (e) {
 if (active) setCloudStatus('ERROR');
 }
 };

 bootstrapData();

 const channel = client.channel(`schooltap-norm-${deviceRole}-${schoolId}-${Date.now()}`);

 if (deviceRole === 'PARENT') {
 const codes = linkedCodesKey ? linkedCodesKey.split(',').filter(Boolean) : [];
 if (codes.length > 0) {
 channel.on(
 'postgres_changes',
 { event: 'INSERT', schema: 'public', table: 'schooltap_ride_logs' },
 (chg) => {
 if (!active || !chg?.new) return;
 if (myLinkedIdsRef.current.has(chg.new.student_id)) {
 handleIncomingRideLog(chg.new, false);
 }
 }
 );
 channel.on(
 'postgres_changes',
 { event: 'UPDATE', schema: 'public', table: 'schooltap_students' },
 (chg) => {
 if (!active || !chg?.new) return;
 if (myLinkedIdsRef.current.has(chg.new.id)) {
 const updatedKid = mapStudentFromDb(chg.new);
 setStudents((prev) =>
 prev.map((s) => (s.id === updatedKid.id ? updatedKid : s))
 );
 }
 }
 );
 channel.on(
 'postgres_changes',
 { event: 'DELETE', schema: 'public', table: 'schooltap_students' },
 (chg) => {
 if (!active || !chg?.old?.id) return;
 if (myLinkedIdsRef.current.has(chg.old.id)) {
 myLinkedIdsRef.current.delete(chg.old.id);
 setStudents((prev) => prev.filter((s) => s.id !== chg.old.id));
 }
 }
 );
 } else {
 channel.on(
 'postgres_changes',
 {
 event: '*',
 schema: 'public',
 table: 'schooltap_students',
 filter: `school_id=eq.${schoolId}`
 },
 () => {
 if (active) bootstrapData();
 }
 );
 }
 } else {
 channel.on(
 'postgres_changes',
 {
 event: '*',
 schema: 'public',
 table: 'schooltap_students',
 filter: `school_id=eq.${schoolId}`
 },
 (chg) => {
 if (!active) return;
 if (chg.eventType === 'DELETE' && chg.old?.id) {
 setStudents((prev) => prev.filter((s) => s.id !== chg.old.id));
 } else if (chg.new?.id) {
 const mapped = mapStudentFromDb(chg.new);
 setStudents((prev) => {
 const exists = prev.some((s) => s.id === mapped.id);
 return exists
 ? prev.map((s) => (s.id === mapped.id ? mapped : s))
 : [...prev, mapped];
 });
 }
 }
 );
 channel.on(
 'postgres_changes',
 {
 event: 'INSERT',
 schema: 'public',
 table: 'schooltap_ride_logs',
 filter: `school_id=eq.${schoolId}`
 },
 (chg) => {
 if (!active || !chg?.new) return;
 handleIncomingRideLog(chg.new, false);
 }
 );
 }

 channel.subscribe((status) => {
 if (!active) return;
 if (status === 'SUBSCRIBED') {
 setCloudStatus('CONNECTED');
 }
 });

 const handleVisibilitySync = async () => {
 if (document.visibilityState === 'visible') {
 bootstrapData();
 }
 };
 document.addEventListener('visibilitychange', handleVisibilitySync);

 return () => {
 active = false;
 document.removeEventListener('visibilitychange', handleVisibilitySync);
 client.removeChannel(channel);
 };
 }, [sbUrl, sbKey, deviceRole, schoolId, linkedCodesKey, handleIncomingRideLog]);

 const sendApproachingAlert = useCallback(
 (stu, customEtaMins, autoTriggered = false, distMeters = null) => {
 const target = stu || currentStudent || students[0];
 if (!target) return;
 const nowMs = Date.now();
 const etaVal = customEtaMins || activePreset.etaMins || approachingMins;
 const etaLog = {
 id: `eta-${target.id}-${nowMs}`,
 schoolId,
 studentId: target.id,
 studentName: target.nameKo,
 vehicleId: currentBusObj.id,
 vehicleNameKo: currentBusObj.nameKo,
 vehicleNameEn: currentBusObj.nameEn,
 type: 'APPROACHING_10M',
 etaMinutes: etaVal,
 distanceMeters: distMeters,
 autoGps: autoTriggered,
 stopKo: target.stopKo,
 stopEn: target.stopEn,
 tagTimeMs: nowMs,
 phraseIdx: Math.floor(Math.random() * 2)
 };
 etaSentLockRef.current[target.id] = true;
 setLogs((prev) => [etaLog, ...prev]);
 insertRideLogToDb(etaLog);
 playChime('APPROACHING_10M', soundMuted);

 setReaderBanner({
 type: 'ETA_SENT',
 student: target,
 etaMins: etaVal,
 distMeters,
 timeMs: nowMs
 });

 showToast(
 isEn
 ? `📍 ${autoTriggered ? '[Auto GPS] ' : ''}Sent ~${etaVal}m ETA alert to ${sName(target)}'s parent!`
 : `📍 ${autoTriggered ? '[GPS 반경진입 자동] ' : ''}[${sName(target)}] 학부모님께 도착 ${etaVal}분 전 알림 발송!`
 );
 },
 [
 currentStudent,
 students,
 activePreset,
 approachingMins,
 schoolId,
 currentBusObj,
 insertRideLogToDb,
 soundMuted,
 isEn,
 sName,
 showToast
 ]
 );

 const noAlightSentLockRef = useRef({});

 const sendNoAlightAlert = useCallback(
 (stu, isTest = false) => {
 const target = stu || currentStudent || students[0];
 if (!target) return;
 const nowMs = Date.now();
 const boardSessionId = target.activeSession?.boardTimeMs || nowMs;
 const lockKey = `${target.id}-${boardSessionId}`;
 if (!isTest && noAlightSentLockRef.current[lockKey]) return;

 noAlightSentLockRef.current[lockKey] = true;
 const alertLog = {
 id: `noalight-${target.id}-${nowMs}`,
 schoolId,
 studentId: target.id,
 studentName: target.nameKo,
 vehicleId: target.activeSession?.vehicleId || currentBusObj.id,
 vehicleNameKo: currentBusObj.nameKo,
 vehicleNameEn: currentBusObj.nameEn,
 type: 'NO_ALIGHT_1H',
 stopKo: target.stopKo,
 stopEn: target.stopEn,
 tagTimeMs: nowMs,
 phraseIdx: Math.floor(Math.random() * 2)
 };
 setLogs((prev) => [alertLog, ...prev]);
 insertRideLogToDb(alertLog);
 playChime('NO_ALIGHT_1H', soundMuted);

 setReaderBanner({
 type: 'NO_ALIGHT_1H',
 student: target,
 timeMs: nowMs
 });

 showToast(
 isEn
 ? `🚨 [1h Safety Alert] Sent missing drop-off alert for ${sName(target)}!`
 : `🚨 [1시간 미하차 안전알림] [${sName(target)}] 학부모님께 하차 미태그 알림 발송!`
 );
 },
 [currentStudent, students, schoolId, currentBusObj, insertRideLogToDb, soundMuted, isEn, sName, showToast]
 );

 useEffect(() => {
 const ONE_HOUR_MS = 60 * 60 * 1000;
 const checkOverdueBoarding = () => {
 const now = Date.now();
 students.forEach((stu) => {
 if (!stu.activeSession || !stu.activeSession.boardTimeMs) return;
 const elapsed = now - Number(stu.activeSession.boardTimeMs);
 if (elapsed >= ONE_HOUR_MS) {
 const lockKey = `${stu.id}-${stu.activeSession.boardTimeMs}`;
 const alreadyLogged = logs.some(
 (l) =>
 l.studentId === stu.id &&
 l.type === 'NO_ALIGHT_1H' &&
 l.tagTimeMs >= Number(stu.activeSession.boardTimeMs)
 );
 if (!noAlightSentLockRef.current[lockKey] && !alreadyLogged) {
 sendNoAlightAlert(stu, false);
 }
 }
 });
 };

 checkOverdueBoarding();
 const timer = setInterval(checkOverdueBoarding, 15000);
 return () => clearInterval(timer);
 }, [students, logs, sendNoAlightAlert]);

 const toggleGpsTracker = useCallback(() => {
 if (gpsTracking) {
 if (gpsWatchIdRef.current !== null && 'geolocation' in navigator) {
 navigator.geolocation.clearWatch(gpsWatchIdRef.current);
 gpsWatchIdRef.current = null;
 }
 setGpsTracking(false);
 showToast(isEn ? '🛰️ Live GPS tracking paused.' : '🛰️ 실시간 GPS 추적을 일시 중지했습니다.');
 return;
 }

 if (!('geolocation' in navigator)) {
 showToast(isEn ? '⚠️ GPS is not supported on this browser.' : '⚠️ 이 브라우저에서는 GPS 기능을 지원하지 않습니다.');
 return;
 }

 const watchId = navigator.geolocation.watchPosition(
 (pos) => {
 const speedMs = pos.coords.speed;
 setBusCoords({
 lat: pos.coords.latitude,
 lng: pos.coords.longitude,
 accuracy: Math.round(pos.coords.accuracy || 0),
 speedKmh: typeof speedMs === 'number' && speedMs >= 0 ? Math.round(speedMs * 3.6) : 0,
 updatedAt: Date.now()
 });
 setGpsTracking(true);
 },
 () => {
 showToast(
 isEn
 ? '❌ Please allow Location (GPS) permission in Chrome!'
 : '❌ 휴대폰 위치(GPS) 켜짐 및 Chrome 위치 권한 [허용]을 확인해 주세요!'
 );
 setGpsTracking(false);
 },
 {
 enableHighAccuracy: true,
 maximumAge: 3000,
 timeout: 12000
 }
 );
 gpsWatchIdRef.current = watchId;
 showToast(
 isEn
 ? '🛰️ Live GPS Geofence Active! Watching stop distances automatically.'
 : '🛰️ 실시간 GPS 정류장 감시 시작! 반경 진입 시 자동으로 알림을 쏩니다.'
 );
 }, [gpsTracking, isEn, showToast]);

 useEffect(() => {
 return () => {
 if (gpsWatchIdRef.current !== null && 'geolocation' in navigator) {
 navigator.geolocation.clearWatch(gpsWatchIdRef.current);
 }
 };
 }, []);

 useEffect(() => {
 if (!gpsTracking || !busCoords) return;

 students.forEach((stu) => {
 if (typeof stu.stopLat !== 'number' || typeof stu.stopLng !== 'number') return;
 if (etaSentLockRef.current[stu.id]) return;

 const isTarget =
 runDirection === 'DROPOFF'
 ? Boolean(stu.activeSession)
 : !stu.activeSession && (stu.routeId || 'BUS-01') === currentBusObj.id;

 if (!isTarget) return;

 const distM = calcDistanceMeters(
 busCoords.lat,
 busCoords.lng,
 stu.stopLat,
 stu.stopLng
 );

 if (distM !== null && distM <= activePreset.radiusM) {
 sendApproachingAlert(stu, activePreset.etaMins, true, distM);
 }
 });
 }, [busCoords, gpsTracking, students, runDirection, currentBusObj, activePreset, sendApproachingAlert]);

 const pinCurrentGpsToStudent = (stuId) => {
 const saveCoords = (lat, lng) => {
 let updatedTarget = null;
 const updated = students.map((s) => {
 if (s.id === stuId) {
 updatedTarget = { ...s, stopLat: lat, stopLng: lng };
 return updatedTarget;
 }
 return s;
 });
 delete etaSentLockRef.current[stuId];
 setStudents(updated);
 if (updatedTarget) {
 syncSingleStudentToDb(updatedTarget);
 showToast(
 isEn
 ? `📌 Saved current GPS (${lat.toFixed(4)}, ${lng.toFixed(4)}) as ${sName(updatedTarget)}'s stop!`
 : `📌 현재 위치(${lat.toFixed(4)}, ${lng.toFixed(4)})가 [${sName(updatedTarget)}] 정류장으로 저장되었습니다!`
 );
 }
 };

 if (busCoords) {
 saveCoords(busCoords.lat, busCoords.lng);
 return;
 }
 if ('geolocation' in navigator) {
 navigator.geolocation.getCurrentPosition(
 (pos) => {
 const lat = pos.coords.latitude;
 const lng = pos.coords.longitude;
 setBusCoords({
 lat,
 lng,
 accuracy: Math.round(pos.coords.accuracy || 0),
 speedKmh: 0,
 updatedAt: Date.now()
 });
 saveCoords(lat, lng);
 },
 () => {
 showToast(
 isEn
 ? '❌ Turn ON Location (GPS) first to pin stop!'
 : '❌ 먼저 위치(GPS) 권한을 허용해 주세요!'
 );
 },
 { enableHighAccuracy: true, timeout: 8000 }
 );
 }
 };

 const startGalaxyNfcScanner = async () => {
 if (!('NDEFReader' in window)) {
 showToast(
 isEn
 ? '⚠️ Tap [Open in Chrome App] below — Samsung Internet blocks Web NFC!'
 : '⚠️ 현재 삼성 인터넷으로 열렸습니다! 아래 [🚀 Chrome 앱으로 즉시 열기] 버튼을 눌러주세요.'
 );
 return;
 }
 try {
 const ndef = new window.NDEFReader();
 await ndef.scan();
 setNfcScanning(true);
 ndef.onreading = (event) => {
 const serial = event.serialNumber || 'NEW-TAG-' + Math.floor(1000 + Math.random() * 9000);
 if (handleTagUidRef.current) handleTagUidRef.current(serial);
 };
 if ('wakeLock' in navigator) {
 try {
 await navigator.wakeLock.request('screen');
 setWakeLockActive(true);
 } catch (e) {}
 }
 playChime('BOARD', soundMuted);
 showToast(
 isEn
 ? '📡 NFC Scanner Active! Tap backpack charm to back of phone.'
 : '📡 실물 NFC 리더 가동 완료! 폰 뒷면에 스티커를 삑! 대주세요.'
 );
 } catch (err) {
 showToast(
 isEn
 ? `❌ NFC Error (${err.name}): Turn ON NFC in phone bar & allow Chrome NFC permission!`
 : `❌ NFC 차단됨 (${err.name}): 상단바 NFC 켜짐 및 Chrome 우측상단 [⋮ → 설정 → 사이트 설정 → NFC 허용]을 확인해 주세요!`
 );
 }
 };

 const handleTagUidRef = useRef(null);
 const handleTagUid = useCallback(
 (rawUid) => {
 const cleanUid = (rawUid || '').trim().toUpperCase();
 if (!cleanUid) return;

 if (capturingUidForEdit) {
 setEditUid(cleanUid);
 setCapturingUidForEdit(false);
 playChime('BOARD', soundMuted);
 showToast(
 isEn
 ? `✅ Captured NFC Sticker UID (${cleanUid}) for editing!`
 : `✅ 수정용 새 스티커 UID(${cleanUid})가 입력되었습니다!`
 );
 return;
 }

 if (capturingUidForOffice) {
 setNewStuUid(cleanUid);
 setCapturingUidForOffice(false);
 playChime('BOARD', soundMuted);
 showToast(
 isEn
 ? `✅ Captured NFC Sticker UID (${cleanUid})!`
 : `✅ 새 스티커 UID(${cleanUid})가 자동 입력되었습니다!`
 );
 return;
 }

 const stu = students.find((s) => (s.uid || '').toUpperCase() === cleanUid);

 if (!stu) {
 playChime('ERROR', soundMuted);
 setUnregisteredUid(cleanUid);
 setReaderBanner({
 type: 'UNREGISTERED',
 uid: cleanUid,
 timeMs: Date.now()
 });
 return;
 }

 const nowMs = Date.now();
 const DUPLICATE_COOLDOWN_MS = 180000;
 if (stu.lastTapMs && nowMs - stu.lastTapMs < DUPLICATE_COOLDOWN_MS) {
 const remainSec = Math.ceil((DUPLICATE_COOLDOWN_MS - (nowMs - stu.lastTapMs)) / 1000);
 const remainMin = Math.floor(remainSec / 60);
 const remSecOnly = remainSec % 60;
 const remainLabel = isEn
 ? `${remainMin > 0 ? remainMin + 'm ' : ''}${remSecOnly}s`
 : `${remainMin > 0 ? remainMin + '분 ' : ''}${remSecOnly}초`;
 playChime('ERROR', soundMuted);
 speakVoice(
 isEn ? 'Already scanned within 3 minutes!' : '이미 태그되었습니다. 3분간 중복 방지됩니다.',
 lang,
 soundMuted
 );
 setReaderBanner({
 type: 'DUPLICATE',
 student: stu,
 remain: remainSec,
 remainLabel,
 timeMs: nowMs
 });
 return;
 }

 const actionType = stu.activeSession ? 'ALIGHT' : 'BOARD';
 const phraseIdx = Math.floor(Math.random() * 4);

 if (actionType === 'ALIGHT') {
 delete etaSentLockRef.current[stu.id];
 }

 const shouldAutoPin =
 autoPinEnabled &&
 busCoords &&
 (typeof stu.stopLat !== 'number' || typeof stu.stopLng !== 'number');

 const updatedStudent = {
 ...stu,
 stopLat: shouldAutoPin ? busCoords.lat : stu.stopLat,
 stopLng: shouldAutoPin ? busCoords.lng : stu.stopLng,
 activeSession:
 actionType === 'BOARD'
 ? { boardTimeMs: nowMs, vehicleId: currentBusObj.id }
 : null,
 lastTapMs: nowMs
 };

 const updatedList = students.map((item) =>
 item.id === stu.id ? updatedStudent : item
 );
 setStudents(updatedList);
 setUnregisteredUid('');

 syncSingleStudentToDb(updatedStudent);

 const newLog = {
 id: `tap-${stu.id}-${nowMs}`,
 schoolId,
 studentId: stu.id,
 studentName: stu.nameKo,
 vehicleId: currentBusObj.id,
 vehicleNameKo: currentBusObj.nameKo,
 vehicleNameEn: currentBusObj.nameEn,
 type: actionType,
 tagTimeMs: nowMs,
 stopKo: stu.stopKo,
 stopEn: stu.stopEn,
 phraseIdx
 };

 setLogs((prev) => [newLog, ...prev]);
 insertRideLogToDb(newLog);

 playChime(actionType, soundMuted);
 const dispName = sName(stu);
 speakVoice(
 isEn
 ? `${dispName}, ${actionType === 'BOARD' ? 'boarding' : 'drop-off'} confirmed!`
 : `${dispName} 어린이, ${actionType === 'BOARD' ? '승차' : '하차'} 확인되었습니다.`,
 lang,
 soundMuted
 );

 if (shouldAutoPin) {
 showToast(
 isEn
 ? `📌 Auto-Pinned ${dispName}'s bus stop coordinates from this tap!`
 : `📌 [자동 기억 완료] 방금 찍은 위치가 ${dispName}의 정류장 GPS로 자동 저장되었습니다!`

 isEn
 ? '✅ Background push subscription registered!'
 : '✅ 백그라운드 푸시 구독이 등록되었습니다!'
 );
 } else {
 showToast(
 isEn
 ? '💡 Please paste your VAPID Public Key first!'
 : '💡 먼저 VAPID Public Key를 입력해 주세요!'
 );
 }
 }
 }}
 className="px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black shrink-0"
 >
 {isEn ? '📲 Register Push' : '📲 푸시 구독'}
 </button>
 </div>
 {pushSubJson && (
 <div className="text-[10px] font-mono text-indigo-700 truncate">
 ✔ 구독 Endpoint 등록됨
 </div>
 )}
 </div>

 <button
 onClick={() => {
 localStorage.setItem('schooltap_sb_url', sbUrl.trim());
 localStorage.setItem('schooltap_sb_key', sbKey.trim());
 setCloudModalOpen(false);
 showToast(isEn ? '☁️ Cloud settings saved!' : '☁️ 설정 저장 완료!');
 }}
 className="w-full py-3 rounded-2xl bg-emerald-600 text-white font-black text-xs"
 >
 {isEn ? 'Save & Close' : '닫기'}
 </button>
 </div>
 </div>
 )}

 <header className="sticky top-0 z-30 bg-[#FFFDF7]/95 backdrop-blur border-b border-amber-200">
 <div className="max-w-3xl mx-auto px-4 py-3 space-y-2.5">
 <div className="flex items-center justify-between gap-2">
 <div className="flex items-center gap-2">
 <span className="w-9 h-9 rounded-2xl bg-amber-400 flex items-center justify-center text-lg shadow-xs">🚌</span>
 <div>
 <h1 className="text-base font-black leading-none">
 SchoolTap{' '}
 <span className="text-amber-600">
 {deviceRole === 'PARENT'
 ? isEn
 ? 'Parent App'
 : '학부모 안심톡'
 : deviceRole === 'READER'
 ? isEn
 ? 'Bus Reader'
 : '차량 단말기'
 : isEn
 ? 'Admin Console'
 : '원장님 관리콘솔'}
 </span>
 </h1>
 <span
 onClick={() => setCloudModalOpen(true)}
 className="text-[11px] text-slate-500 font-bold cursor-pointer underline decoration-dotted"
 >
 {deviceRole === 'PARENT'
 ? cloudStatus === 'CONNECTED'
 ? isEn
 ? '🟢 Live Bubble & GPS Alerts Active'
 : '🟢 실시간 안심 버블 & GPS 알림 켜짐'
 : cloudStatus === 'ERROR'
 ? isEn
 ? '🔴 DB / API Key Error (Tap to Fix)'
 : '🔴 DB / API 키 오류 (여기를 눌러 확인)'
 : isEn
 ? '🟡 Tap here to enter API Key'
 : '🟡 여기를 눌러 API 키 연결'
 : deviceRole === 'READER'
 ? isEn
 ? 'Auto NFC + Live GPS Geofence'
 : '무인 NFC 스캔 + 실시간 GPS 감시'
 : isEn
 ? `School & Fleet Management (${schoolId})`
 : `PC / 사업주 통합 관리 모드 (${schoolId})`}
 </span>
 </div>
 </div>

 <div className="flex items-center gap-1.5">
 {deviceRole === 'ADMIN' && (
 <button
 onClick={() => setCloudModalOpen(true)}
 className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${
 cloudStatus === 'CONNECTED'
 ? 'bg-emerald-500 border-emerald-600 text-white'
 : 'bg-white border-emerald-400 text-emerald-800'
 }`}
 >
 {cloudStatus === 'CONNECTED'
 ? isEn
 ? '🟢 QR Center'
 : '🟢 QR 배포센터'
 : isEn
 ? '☁️ Connect Phones'
 : '☁️ 갤럭시 2대 연결'}
 </button>
 )}

 {deviceRole === 'READER' && (
 <button
 onClick={() => setAdminUnlockModalOpen(true)}
 className="px-2.5 py-1.5 rounded-xl bg-slate-200 text-slate-600 text-[11px] font-bold"
 >
 {isEn ? '🔒 Admin' : '🔒 관리자'}
 </button>
 )}

 <button
 onClick={() => setLang(isEn ? 'ko' : 'en')}
 className="px-2.5 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-extrabold"
 >
 {isEn ? '🇰🇷 KR' : '🇺🇸 US'}
 </button>
 </div>
 </div>

 {deviceRole === 'ADMIN' && (
 <div className="grid grid-cols-3 gap-1.5">
 <button
 onClick={() => setAdminTab('OFFICE')}
 className={`py-2 rounded-2xl text-xs font-black border ${
 adminTab === 'OFFICE' ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-slate-200 text-slate-600'
 }`}
 >
 {isEn ? '🏫 Roster & Charms' : '🏫 키링·원생 관리'}
 </button>
 <button
 onClick={() => setAdminTab('READER')}
 className={`py-2 rounded-2xl text-xs font-black border ${
 adminTab === 'READER' ? 'bg-slate-900 border-slate-900 text-white' : 'bg-white border-slate-200 text-slate-600'
 }`}
 >
 {isEn ? '📲 Bus Reader View' : '📲 단말기 화면보기'}
 </button>
 <button
 onClick={() => setAdminTab('PARENT_PREVIEW')}
 className={`py-2 rounded-2xl text-xs font-black border ${
 adminTab === 'PARENT_PREVIEW' ? 'bg-amber-400 border-amber-500 text-slate-950' : 'bg-white border-slate-200 text-slate-600'
 }`}
 >
 {isEn ? '💛 Parent View' : '💛 학부모 화면보기'}
 </button>
 </div>
 )}
 </div>
 </header>

 <main className="max-w-3xl mx-auto px-4 pt-4">
 {deviceRole === 'PARENT' ? (
 renderDedicatedParentView()
 ) : deviceRole === 'READER' ? (
 renderBusReaderView()
 ) : adminTab === 'OFFICE' ? (
 renderAdminOfficeView()
 ) : adminTab === 'READER' ? (
 renderBusReaderView()
 ) : (
 renderDedicatedParentView()
 )}
 </main>

 {toast && (
 <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900 text-white text-xs font-black shadow-xl max-w-sm w-[90%] text-center">
 {toast}
 </div>
 )}
 </div>
 );
 }

 const root = ReactDOM.createRoot(document.getElementById('root'));
 root.render(<App />);
 </script>
</body>
</html>
