  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #FFFDF7;
      -webkit-tap-highlight-color: transparent;
    }
    .bubble-pop-in {
      animation: bubblePopSpring 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes bubblePopSpring {
      0% { opacity: 0; transform: scale(0.45) translateY(30px); }
      65% { opacity: 1; transform: scale(1.04) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .float-bounce {
      animation: floatBounceY 2.2s ease-in-out infinite;
    }
    @keyframes floatBounceY {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    .tap-pulse {
      animation: pulseRing 1.9s infinite;
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 24px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const DEFAULT_SUPABASE_URL = 'https://vhwdxgpnubmieytjuaaw.supabase.co';

    // 보호자 호칭 다국어 매핑 (한<->영 전환 시 실시간 자동 번역)
    const RELATION_OPTIONS = [
      { key: 'MOM', ko: '엄마', en: 'Mom' },
      { key: 'DAD', ko: '아빠', en: 'Dad' },
      { key: 'GRAND', ko: '조부모님', en: 'Grandparent' },
      { key: 'GUARDIAN', ko: '보호자', en: 'Guardian' }
    ];

    const normalizeRelKey = (val) => {
      if (!val) return 'MOM';
      const found = RELATION_OPTIONS.find(
        (r) => r.key === val || r.ko === val || r.en.toLowerCase() === String(val).toLowerCase()
      );
      return found ? found.key : 'MOM';
    };

    const getRelLabel = (relKey, lang) => {
      const found = RELATION_OPTIONS.find((r) => r.key === normalizeRelKey(relKey)) || RELATION_OPTIONS[0];
      return lang === 'en' ? found.en : found.ko;
    };

    // 지구 곡률 기반 두 GPS 좌표 사이 실제 거리(m) 계산 (Haversine 공식)
    const calcDistanceMeters = (lat1, lng1, lat2, lng2) => {
      if (
        typeof lat1 !== 'number' ||
        typeof lng1 !== 'number' ||
        typeof lat2 !== 'number' ||
        typeof lng2 !== 'number'
      ) {
        return null;
      }
      const toRad = (deg) => (deg * Math.PI) / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2)) *
          Math.sin(dLng / 2) *
          Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    };

    const formatDistanceLabel = (meters, isEn) => {
      if (meters === null || meters === undefined) {
        return isEn ? 'No GPS Pin' : '좌표 미등록';
      }
      if (meters >= 1000) {
        return `${(meters / 1000).toFixed(2)} km`;
      }
      return `${meters} m`;
    };

    // 클립보드 안전 복사 헬퍼
    const safeCopyText = (text) => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (e) {
        return false;
      }
    };

    // 효과음 및 음성 안내 합성기
    const playChime = (type = 'BOARD', muted = false) => {
      if (muted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const tone = (freq, start, dur, wave = 'triangle', vol = 0.2) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(vol, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + dur + 0.02);
        };
        if (type === 'BOARD') {
          tone(523.25, now, 0.1);
          tone(659.25, now + 0.08, 0.1);
          tone(783.99, now + 0.16, 0.12);
          tone(1046.5, now + 0.25, 0.25, 'sine', 0.24);
        } else if (type === 'ALIGHT') {
          tone(659.25, now, 0.08, 'sine');
          tone(783.99, now + 0.07, 0.08, 'sine');
          tone(880.0, now + 0.14, 0.08, 'sine');
          tone(1046.5, now + 0.21, 0.12);
          tone(1318.5, now + 0.3, 0.26, 'sine', 0.24);
        } else if (type === 'APPROACHING_10M') {
          tone(587.33, now, 0.09);
          tone(783.99, now + 0.09, 0.09);
          tone(987.77, now + 0.18, 0.11, 'sine');
          tone(1174.66, now + 0.28, 0.26, 'sine', 0.24);
        } else {
          tone(330, now, 0.12, 'sawtooth', 0.14);
          tone(262, now + 0.13, 0.18, 'sawtooth', 0.14);
        }
      } catch (e) {}
    };

    const speakVoice = (text, lang = 'ko', muted = false) => {
      if (muted) return;
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = lang === 'en' ? 'en-US' : 'ko-KR';
          utter.rate = 1.05;
          window.speechSynthesis.speak(utter);
        }

    const BUS_ROUTES = [

        { id: 'c2', category: 'SUPPLIES', titleKo: '도서관 빌린 책 가방에 넣기', titleEn: 'Bring library book to return', done: false },

    function App() {
      const params = useMemo(() => new URLSearchParams(window.location.search), []);

      // 기기 권한(Role): PARENT | READER | ADMIN
      const [deviceRole, setDeviceRole] = useState(() => {
        const r = (params.get('role') || params.get('mode') || '').toUpperCase();
        if (r === 'PARENT') return 'PARENT';
        if (r === 'READER') return 'READER';
        return 'ADMIN';
      });

      const [lang, setLang] = useState(() => {
        const pLang = params.get('lang');
        if (pLang === 'en' || pLang === 'ko') {
          localStorage.setItem('schooltap_lang', pLang);
          return pLang;
        }
        return localStorage.getItem('schooltap_lang') === 'en' ? 'en' : 'ko';
      });

      const isEn = lang === 'en';

      useEffect(() => {
        localStorage.setItem('schooltap_lang', lang);
        document.documentElement.lang = lang;
        document.title = isEn
          ? 'SchoolTap™ | Smart Bus Bubble Alerts'
          : 'SchoolTap™ | 통학 안심 버블 알림';
      }, [lang, isEn]);

      const sName = useCallback(
        (stu) => (!stu ? '' : isEn ? stu.nameEn || stu.nameKo : stu.nameKo || stu.nameEn),
        [isEn]
      );
      const sStop = useCallback(
        (stu) =>
          !stu
            ? isEn
              ? 'Home Bus Stop'
              : '집 앞 정류장'

            ? stu.stopEn || stu.stopKo
            : stu.stopKo || stu.stopEn,

      );
      const sGrade = useCallback(
        (stu) => (!stu ? '' : isEn ? stu.gradeEn || stu.gradeKo : stu.gradeKo || stu.gradeEn),

      );

      const [adminTab, setAdminTab] = useState('OFFICE');
      const [selectedBusRouteId, setSelectedBusRouteId] = useState('BUS-01');
      const [runDirection, setRunDirection] = useState('DROPOFF');

      const currentBusObj = useMemo(
        () => BUS_ROUTES.find((r) => r.id === selectedBusRouteId) || BUS_ROUTES[0],
        [selectedBusRouteId]
      );
      const vehicleName = isEn ? currentBusObj.nameEn : currentBusObj.nameKo;

      // Supabase 클라우드 연결 정보
      const [sbUrl, setSbUrl] = useState(() => {
        const u = params.get('sbUrl');
        if (u) localStorage.setItem('schooltap_sb_url', u);
        return u || localStorage.getItem('schooltap_sb_url') || DEFAULT_SUPABASE_URL;
      });
      const [sbKey, setSbKey] = useState(() => {
        const k = params.get('sbKey');
        if (k) localStorage.setItem('schooltap_sb_key', k);
        return k || localStorage.getItem('schooltap_sb_key') || '';
      });

      const [cloudStatus, setCloudStatus] = useState('IDLE');
      const [lastTxDebug, setLastTxDebug] = useState('');
      const [cloudModalOpen, setCloudModalOpen] = useState(false);
      const [publicSiteUrl, setPublicSiteUrl] = useState(() => localStorage.getItem('schooltap_public_url') || '');
      const sbClientRef = useRef(null);
      const seenIdsRef = useRef(new Set());
      const deviceIdRef = useRef('dev-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6));

      // 전체 학생 명단
      const [students, setStudents] = useState(() => {
        try {
          const saved = localStorage.getItem('schooltap_students_v7');
          return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
        } catch (e) {
          return INITIAL_STUDENTS;
        }
      });

      // 학부모 폰에 연결된 내 아이 초대코드 상태
      const [parentLinkedCodes, setParentLinkedCodes] = useState(() => {
        const urlInvite = (params.get('invite') || '').trim().toUpperCase();
        try {
          const saved = JSON.parse(localStorage.getItem('schooltap_parent_codes') || '[]');
          const base = Array.isArray(saved) ? saved : [];
          if (urlInvite && !base.includes(urlInvite)) {
            const merged = [urlInvite, ...base];
            localStorage.setItem('schooltap_parent_codes', JSON.stringify(merged));
            return merged;
          }
          return base;
        } catch (e) {
          return urlInvite ? [urlInvite] : [];
        }
      });

      const [inviteCodeInput, setInviteCodeInput] = useState('');
      const [parentRelKey, setParentRelKey] = useState(() =>
        normalizeRelKey(localStorage.getItem('schooltap_parent_rel'))
      );
      const parentRelationDisplay = useMemo(
        () => getRelLabel(parentRelKey, lang),
        [parentRelKey, lang]
      );

      const [addSiblingModalOpen, setAddSiblingModalOpen] = useState(false);
      const [adminUnlockModalOpen, setAdminUnlockModalOpen] = useState(false);
      const [adminPinInput, setAdminPinInput] = useState('');

      const myLinkedChildren = useMemo(() => {
        if (deviceRole === 'ADMIN') return students;
        return students.filter((s) =>
          parentLinkedCodes.includes((s.inviteCode || '').toUpperCase())
        );
      }, [deviceRole, students, parentLinkedCodes]);

      const [activeStudentId, setActiveStudentId] = useState('');

      useEffect(() => {
        if (myLinkedChildren.length > 0) {
          if (!myLinkedChildren.some((s) => s.id === activeStudentId)) {
            setActiveStudentId(myLinkedChildren[0].id);
          }
        } else {
          setActiveStudentId('');
        }
      }, [myLinkedChildren, activeStudentId]);

      const currentStudent = useMemo(
        () => myLinkedChildren.find((s) => s.id === activeStudentId) || myLinkedChildren[0] || null,

      );

      const [logs, setLogs] = useState([]);
      const [parentTab, setParentTab] = useState('BUBBLES');
      const [checklists, setChecklists] = useState(INITIAL_CHECKLISTS);
      const [noticeInput, setNoticeInput] = useState('');

      // 맞춤 알림 옵션
      const [approachingEnabled, setApproachingEnabled] = useState(true);

      // 원장님 화면 신규 학생 등록 폼

      const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast((prev) => (prev === msg ? '' : prev)), 3600);
      }, []);

      const formatTime = (ms) =>
        new Date(ms).toLocaleTimeString(isEn ? 'en-US' : 'ko-KR', {
          hour: isEn ? 'numeric' : '2-digit',
          minute: '2-digit',
          hour12: isEn
        });

      const resolveQuote = (log) => {
        const list = (QUOTES[log.type] || QUOTES.BOARD)[lang] || QUOTES.BOARD.ko;
        const item = list[(log.phraseIdx || 0) % list.length];
        const stopStr = isEn ? log.stopEn || 'Oak Creek Stop' : log.stopKo || '집 앞 정류장';
        const etaStr = String(log.etaMinutes || 10);
        const vName = log.vehicleNameKo && !isEn ? log.vehicleNameKo : log.vehicleNameEn && isEn ? log.vehicleNameEn : vehicleName;
        return {
          emoji: item.emoji,
          title: item.title.replace(/\{vehicle\}/g, vName).replace(/\{stop\}/g, stopStr).replace(/\{eta\}/g, etaStr),
          sub: item.sub.replace(/\{vehicle\}/g, vName).replace(/\{stop\}/g, stopStr).replace(/\{eta\}/g, etaStr)
        };
      };

      const handleConnectChildByCode = (rawCode, relKeyArg) => {
        const clean = (rawCode || '').trim().toUpperCase();
        if (!clean) {
          showToast(
            isEn
              ? 'Please enter an invite code! (e.g., SOYI-1004)'
              : '초대코드를 입력해 주세요! (예: SOYI-1004)'
          );
          return false;
        }
        const matched = students.find((s) => (s.inviteCode || '').toUpperCase() === clean);
        if (!matched) {
          playChime('ERROR', soundMuted);
          showToast(
            isEn
              ? '❌ Invalid invite code. Please check the code provided by your school!'
              : '❌ 일치하는 초대코드가 없습니다. 학원에서 받은 코드를 다시 확인해 주세요!'
          );
          return false;
        }
        const nextCodes = parentLinkedCodes.includes(clean)
          ? parentLinkedCodes
          : [...parentLinkedCodes, clean];
        setParentLinkedCodes(nextCodes);
        localStorage.setItem('schooltap_parent_codes', JSON.stringify(nextCodes));
        const finalRelKey = normalizeRelKey(relKeyArg || parentRelKey);
        setParentRelKey(finalRelKey);
        localStorage.setItem('schooltap_parent_rel', finalRelKey);

        setActiveStudentId(matched.id);
        setInviteCodeInput('');
        setAddSiblingModalOpen(false);
        playChime('BOARD', soundMuted);
        const relTxt = getRelLabel(finalRelKey, lang);
        showToast(
          isEn
            ? `💛 Linked as ${sName(matched)}'s ${relTxt}!`
            : `💛 [${sName(matched)}] 어린이의 ${relTxt} 휴대폰으로 연결되었습니다!`
        );
        return true;
      };

      const handleDisconnectParent = () => {
        setParentLinkedCodes([]);
        localStorage.removeItem('schooltap_parent_codes');
        setPopupLog(null);
        showToast(
          isEn
            ? 'Unlinked. Enter a new invite code to connect another student.'
            : '연결이 해제되었습니다. 새로운 초대코드로 다시 연결해 보세요.'
        );
      };

      const extractPayloadFromRow = (row) => {
        if (!row) return null;
        if (row.payload && typeof row.payload === 'object') return row.payload;
        if (typeof row.note === 'string' && row.note.trim().startsWith('{')) {
          try {
            return JSON.parse(row.note);
          } catch (e) {}
        }
        if (row.eventType && row.studentId) {
          return {
            recordKind: 'BUS_EVENT',
            log: {
              id: row.id,
              studentId: row.studentId,
              type: row.eventType,
              tagTimeMs: Number(row.taggedAt) || Date.now(),
              phraseIdx: 0
            }
          };
        }
        return null;
      };

      const publishToCloud = useCallback(async (rowId, dataObj) => {
        const client = sbClientRef.current;
        if (!client) {
          setLastTxDebug(isEn ? '⚠️ No API Key on Reader' : '⚠️ 단말기에 API 키 미입력');
          return;
        }
        seenIdsRef.current.add(rowId);
        const wrapped = { ...dataObj, senderDevice: deviceIdRef.current };

        try {
          const { error } = await client.from('schooltap_logs').upsert({
            id: rowId,
            payload: wrapped
          });

          if (!error) {
            setLastTxDebug(isEn ? '🟢 Server Synced OK' : '🟢 서버전송 OK');
          } else {
            setLastTxDebug(`🔴 전송실패: ${error.message}`);
          }
        } catch (err) {
          setLastTxDebug(`🔴 네트워크 오류: ${err.message}`);
        }
      }, [isEn]);

      const myLinkedIdsRef = useRef(new Set());
      useEffect(() => {
        myLinkedIdsRef.current = new Set(myLinkedChildren.map((c) => c.id));
      }, [myLinkedChildren]);

      const handleIncomingCloudData = useCallback(
        (rowId, parsed, isHistory = false) => {
          if (!rowId || !parsed || seenIdsRef.current.has(rowId)) return;
          seenIdsRef.current.add(rowId);

          if (parsed.recordKind === 'STUDENT_SYNC' && Array.isArray(parsed.students)) {
            setStudents(parsed.students);
            return;
          }

          const incomingLog = parsed.log;
          if (!incomingLog || !incomingLog.type) return;

          setLogs((prev) => {
            if (prev.some((l) => l.id === incomingLog.id)) return prev;
            return [incomingLog, ...prev].sort((a, b) => b.tagTimeMs - a.tagTimeMs);
          });

          setStudents((prev) =>
            prev.map((s) => {
              if (s.id !== incomingLog.studentId) return s;
              if (incomingLog.type === 'BOARD') {
                return {
                  ...s,
                  activeSession: {
                    boardTimeMs: incomingLog.tagTimeMs,
                    vehicleId: incomingLog.vehicleId || 'BUS-01'
                  }
                };
              }
              if (incomingLog.type === 'ALIGHT') {
                return { ...s, activeSession: null };
              }
              return s;
            })
          );

          const isShowingParentScreen =
            deviceRole === 'PARENT' || (deviceRole === 'ADMIN' && adminTab === 'PARENT_PREVIEW');

          if (
            !isHistory &&
            parsed.senderDevice !== deviceIdRef.current &&
            isShowingParentScreen &&
            myLinkedIdsRef.current.has(incomingLog.studentId)
          ) {
            setActiveStudentId(incomingLog.studentId);
            const allowPopup =
              incomingLog.type === 'APPROACHING_10M' ? approachingEnabled : tapBubbleEnabled;
            if (allowPopup) {
              playChime(incomingLog.type, soundMuted);
              setPopupLog(incomingLog);
            }
          }
        },
        [deviceRole, adminTab, approachingEnabled, tapBubbleEnabled, soundMuted]
      );

      useEffect(() => {
        if (!sbUrl || !sbKey || !window.supabase) {
          setCloudStatus('IDLE');
          sbClientRef.current = null;
          return;
        }
        setCloudStatus('CONNECTING');
        const client = window.supabase.createClient(sbUrl, sbKey);
        sbClientRef.current = client;

        let active = true;
        client
          .from('schooltap_logs')
          .select('id')
          .limit(1)
          .then(({ error }) => {
            if (!active) return;
            if (!error) {
              setCloudStatus('CONNECTED');
            } else {
              console.warn('Supabase check error:', error);
              setCloudStatus('ERROR');
            }
          });

        const channel = client
          .channel('schooltap-realtime-v9')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'schooltap_logs' }, (chg) => {
            if (!active) return;
            setCloudStatus('CONNECTED');
            if (chg?.new) {
              handleIncomingCloudData(chg.new.id, extractPayloadFromRow(chg.new), false);
            }
          })
          .subscribe((status) => {
            if (!active) return;
            if (status === 'SUBSCRIBED') {
              setCloudStatus('CONNECTED');
            }
          });

        const poll = setInterval(async () => {
          try {
            let { data, error } = await client
              .from('schooltap_logs')
              .select('*')
              .order('created_at', { ascending: false })
              .limit(15);

            if (error) {
              const fallback = await client.from('schooltap_logs').select('*').limit(30);
              data = fallback.data;
              error = fallback.error;
            }

            if (!active) return;
            if (!error && Array.isArray(data)) {
              setCloudStatus('CONNECTED');
              data
                .slice()
                .reverse()
                .forEach((r) => {
                  const parsed = extractPayloadFromRow(r);
                  const ts = parsed?.log?.tagTimeMs || parsed?.syncedAt || 0;
                  const isOld = Date.now() - ts > 45000;
                  handleIncomingCloudData(r.id, parsed, isOld);
                });
            }
          } catch (e) {}
        }, 1500);

        return () => {
          active = false;
          clearInterval(poll);
          client.removeChannel(channel);
        };
      }, [sbUrl, sbKey, handleIncomingCloudData]);

      // 도착 예정 알림 발송 공통 함수
      const sendApproachingAlert = useCallback(
        (stu, customEtaMins, autoTriggered = false, distMeters = null) => {
          const target = stu || currentStudent || students[0];
          if (!target) return;
          const nowMs = Date.now();
          const etaVal = customEtaMins || activePreset.etaMins || approachingMins;
          const etaLog = {
            id: `eta-${target.id}-${nowMs}`,
            studentId: target.id,
            studentName: target.nameKo,
            vehicleId: currentBusObj.id,
            vehicleNameKo: currentBusObj.nameKo,
            vehicleNameEn: currentBusObj.nameEn,
            type: 'APPROACHING_10M',
            etaMinutes: etaVal,
            distanceMeters: distMeters,
            autoGps: autoTriggered,
            stopKo: target.stopKo,
            stopEn: target.stopEn,
            tagTimeMs: nowMs,
            phraseIdx: Math.floor(Math.random() * 2)
          };
          etaSentLockRef.current[target.id] = true;
          setLogs((prev) => [etaLog, ...prev]);
          publishToCloud(etaLog.id, { recordKind: 'BUS_EVENT', log: etaLog });
          playChime('APPROACHING_10M', soundMuted);

          setReaderBanner({
            type: 'ETA_SENT',
            student: target,
            etaMins: etaVal,
            distMeters,
            timeMs: nowMs
          });

          showToast(
            isEn
              ? `📍 ${autoTriggered ? '[Auto GPS] ' : ''}Sent ~${etaVal}m ETA alert to ${sName(target)}'s parent!`
              : `📍 ${autoTriggered ? '[GPS 반경진입 자동] ' : ''}[${sName(target)}] 학부모님께 도착 ${etaVal}분 전 알림 발송!`
          );
        },
        [
          currentStudent,
          students,
          activePreset,
          approachingMins,
          currentBusObj,
          publishToCloud,
          soundMuted,
          isEn,
          sName,
          showToast
        ]
      );

      // 실시간 GPS 위치 추적 켜기/끄기
      const toggleGpsTracker = useCallback(() => {
        if (gpsTracking) {
          if (gpsWatchIdRef.current !== null && 'geolocation' in navigator) {
            navigator.geolocation.clearWatch(gpsWatchIdRef.current);
            gpsWatchIdRef.current = null;
          }
          setGpsTracking(false);
          showToast(isEn ? '🛰️ Live GPS tracking paused.' : '🛰️ 실시간 GPS 추적을 일시 중지했습니다.');
          return;
        }

        if (!('geolocation' in navigator)) {
          showToast(isEn ? '⚠️ GPS is not supported on this browser.' : '⚠️ 이 브라우저에서는 GPS 기능을 지원하지 않습니다.');
          return;
        }

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const speedMs = pos.coords.speed;
            setBusCoords({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: Math.round(pos.coords.accuracy || 0),
              speedKmh: typeof speedMs === 'number' && speedMs >= 0 ? Math.round(speedMs * 3.6) : 0,
              updatedAt: Date.now()
            });
            setGpsTracking(true);
          },
          () => {
            showToast(
              isEn
                ? '❌ Please allow Location (GPS) permission in Chrome!'
                : '❌ 휴대폰 위치(GPS) 켜짐 및 Chrome 위치 권한 [허용]을 확인해 주세요!'
            );
            setGpsTracking(false);
          },
          {
            enableHighAccuracy: true,
            maximumAge: 3000,
            timeout: 12000
          }
        );
        gpsWatchIdRef.current = watchId;
        showToast(
          isEn
            ? '🛰️ Live GPS Geofence Active! Watching stop distances automatically.'
            : '🛰️ 실시간 GPS 정류장 감시 시작! 반경 진입 시 자동으로 알림을 쏩니다.'
        );
      }, [gpsTracking, isEn, showToast]);

      useEffect(() => {
        return () => {
          if (gpsWatchIdRef.current !== null && 'geolocation' in navigator) {
            navigator.geolocation.clearWatch(gpsWatchIdRef.current);
          }
        };
      }, []);

      // 실시간 GPS 반경 진입 판별 (Geofence 엔진)
      useEffect(() => {
        if (!gpsTracking || !busCoords) return;

        students.forEach((stu) => {
          if (typeof stu.stopLat !== 'number' || typeof stu.stopLng !== 'number') return;
          if (etaSentLockRef.current[stu.id]) return;

          const isTarget =
            runDirection === 'DROPOFF'
              ? Boolean(stu.activeSession)
              : !stu.activeSession && (stu.routeId || 'BUS-01') === currentBusObj.id;

          if (!isTarget) return;

          const distM = calcDistanceMeters(
            busCoords.lat,
            busCoords.lng,
            stu.stopLat,
            stu.stopLng
          );

          if (distM !== null && distM <= activePreset.radiusM) {
            sendApproachingAlert(stu, activePreset.etaMins, true, distM);
          }
        });
      }, [busCoords, gpsTracking, students, runDirection, currentBusObj, activePreset, sendApproachingAlert]);

      // 현위치 정류장 좌표 수동 지정
      const pinCurrentGpsToStudent = (stuId) => {
        const saveCoords = (lat, lng) => {
          const updated = students.map((s) =>
            s.id === stuId ? { ...s, stopLat: lat, stopLng: lng } : s
          );
          delete etaSentLockRef.current[stuId];
          setStudents(updated);
          publishToCloud(`stu-sync-${Date.now()}`, {
            recordKind: 'STUDENT_SYNC',
            students: updated,
            syncedAt: Date.now()
          });
          const target = updated.find((s) => s.id === stuId);
          showToast(
            isEn
              ? `📌 Saved current GPS (${lat.toFixed(4)}, ${lng.toFixed(4)}) as ${sName(target)}'s stop!`
              : `📌 현재 위치(${lat.toFixed(4)}, ${lng.toFixed(4)})가 [${sName(target)}] 정류장으로 저장되었습니다!`
          );
        };

        if (busCoords) {
          saveCoords(busCoords.lat, busCoords.lng);
          return;
        }
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              setBusCoords({
                lat,
                lng,
                accuracy: Math.round(pos.coords.accuracy || 0),
                speedKmh: 0,
                updatedAt: Date.now()
              });
              saveCoords(lat, lng);
            },
            () => {
              showToast(
                isEn
                  ? '❌ Turn ON Location (GPS) first to pin stop!'
                  : '❌ 먼저 위치(GPS) 권한을 허용해 주세요!'
              );
            },
            { enableHighAccuracy: true, timeout: 8000 }
          );
        }
      };

      // 갤럭시 실물 NFC 단독 개통 (단일 선언)
      const startGalaxyNfcScanner = async () => {
        if (!('NDEFReader' in window)) {
          showToast(
            isEn
              ? '⚠️ Tap [Open in Chrome App] below — Samsung Internet blocks Web NFC!'
              : '⚠️ 현재 삼성 인터넷으로 열렸습니다! 아래 [🚀 Chrome 앱으로 즉시 열기] 버튼을 눌러주세요.'
          );
          return;
        }
        try {
          const ndef = new window.NDEFReader();
          await ndef.scan();
          setNfcScanning(true);
          ndef.onreading = (event) => {
            const serial = event.serialNumber || 'NEW-TAG-' + Math.floor(1000 + Math.random() * 9000);
            if (handleTagUidRef.current) handleTagUidRef.current(serial);
          };
          if ('wakeLock' in navigator) {
            try {
              await navigator.wakeLock.request('screen');
              setWakeLockActive(true);
            } catch (e) {}
          }
          playChime('BOARD', soundMuted);
          showToast(
            isEn
              ? '📡 NFC Scanner Active! Tap backpack charm to back of phone.'
              : '📡 실물 NFC 리더 가동 완료! 폰 뒷면에 스티커를 삑! 대주세요.'
          );
        } catch (err) {
          showToast(
            isEn
              ? `❌ NFC Error (${err.name}): Turn ON NFC in phone bar & allow Chrome NFC permission!`
              : `❌ NFC 차단됨 (${err.name}): 상단바 NFC 켜짐 및 Chrome 우측상단 [⋮ → 설정 → 사이트 설정 → NFC 허용]을 확인해 주세요!`
          );
        }
      };

      // NFC 태그 인식 엔진
      const handleTagUidRef = useRef(null);
      const handleTagUid = useCallback(
        (rawUid) => {
          const cleanUid = (rawUid || '').trim().toUpperCase();
          if (!cleanUid) return;

          if (capturingUidForOffice) {
            setNewStuUid(cleanUid);
            setCapturingUidForOffice(false);
            playChime('BOARD', soundMuted);
            showToast(
              isEn
                ? `✅ Captured NFC Sticker UID (${cleanUid})!`
                : `✅ 새 스티커 UID(${cleanUid})가 자동 입력되었습니다!`
            );
            return;
          }

          const stu = students.find((s) => s.uid.toUpperCase() === cleanUid);

          if (!stu) {
            playChime('ERROR', soundMuted);
            setUnregisteredUid(cleanUid);
            setReaderBanner({
              type: 'UNREGISTERED',
              uid: cleanUid,
              timeMs: Date.now()
            });
            return;
          }

          const nowMs = Date.now();
          if (stu.lastTapMs && nowMs - stu.lastTapMs < 12000) {
            const remain = Math.ceil((12000 - (nowMs - stu.lastTapMs)) / 1000);
            playChime('ERROR', soundMuted);
            speakVoice(isEn ? 'Already scanned!' : '이미 확인되었습니다.', lang, soundMuted);
            setReaderBanner({
              type: 'DUPLICATE',
              student: stu,
              remain,
              timeMs: nowMs
            });
            return;
          }

          const actionType = stu.activeSession ? 'ALIGHT' : 'BOARD';
          const phraseIdx = Math.floor(Math.random() * 4);

          if (actionType === 'ALIGHT') {
            delete etaSentLockRef.current[stu.id];
          }

          const shouldAutoPin =
            autoPinEnabled &&
            busCoords &&
            (typeof stu.stopLat !== 'number' || typeof stu.stopLng !== 'number');

          const updatedList = students.map((item) =>
            item.id === stu.id
              ? {
                  ...item,
                  stopLat: shouldAutoPin ? busCoords.lat : item.stopLat,
                  stopLng: shouldAutoPin ? busCoords.lng : item.stopLng,
                  activeSession:
                    actionType === 'BOARD'
                      ? { boardTimeMs: nowMs, vehicleId: currentBusObj.id }
                      : null,
                  lastTapMs: nowMs
                }
              : item
          );
          setStudents(updatedList);
          setUnregisteredUid('');

          if (shouldAutoPin) {
            publishToCloud(`stu-sync-${nowMs}`, {
              recordKind: 'STUDENT_SYNC',
              students: updatedList,
              syncedAt: nowMs
            });
          }

          const newLog = {
            id: `tap-${stu.id}-${nowMs}`,
            studentId: stu.id,
            studentName: stu.nameKo,
            vehicleId: currentBusObj.id,
            vehicleNameKo: currentBusObj.nameKo,
            vehicleNameEn: currentBusObj.nameEn,
            type: actionType,
            tagTimeMs: nowMs,
            stopKo: stu.stopKo,
            stopEn: stu.stopEn,
            phraseIdx
          };

          setLogs((prev) => [newLog, ...prev]);
          publishToCloud(newLog.id, { recordKind: 'BUS_EVENT', log: newLog });

          playChime(actionType, soundMuted);
          const dispName = sName(stu);
          speakVoice(
            isEn
              ? `${dispName}, ${actionType === 'BOARD' ? 'boarding' : 'drop-off'} confirmed!`
              : `${dispName} 어린이, ${actionType === 'BOARD' ? '승차' : '하차'} 확인되었습니다.`,
            lang,
            soundMuted
          );

          if (shouldAutoPin) {
            showToast(
              isEn
                ? `📌 Auto-Pinned ${dispName}'s bus stop coordinates from this tap!`
                : `📌 [자동 기억 완료] 방금 찍은 위치가 ${dispName}의 정류장 GPS로 자동 저장되었습니다!`
            );
          }

          setReaderBanner({
            type: actionType,
            student: stu,
            autoPinned: shouldAutoPin,
            timeMs: nowMs
          });
        },
        [
          capturingUidForOffice,
          students,
          soundMuted,
          isEn,
          lang,
          autoPinEnabled,
          busCoords,
          currentBusObj,
          publishToCloud,
          sName,
          showToast
        ]
      );

      useEffect(() => {
        handleTagUidRef.current = handleTagUid;
      }, [handleTagUid]);

      // 미등록 스티커 원터치 매칭 함수
      const bindStickerToStudent = (targetStuId) => {
        if (!unregisteredUid) return;
        const boundUid = unregisteredUid;
        const updatedList = students.map((s) =>
          s.id === targetStuId ? { ...s, uid: boundUid } : s
        );
        setStudents(updatedList);
        publishToCloud(`stu-sync-${Date.now()}`, {
          recordKind: 'STUDENT_SYNC',
          students: updatedList,
          syncedAt: Date.now()
        });
        const target = updatedList.find((s) => s.id === targetStuId);
        setUnregisteredUid('');
        playChime('BOARD', soundMuted);
        showToast(
          isEn
            ? `✅ Paired sticker (${boundUid}) to ${sName(target)}! Tap again to test!`
            : `✅ 새 스티커(${boundUid})를 [${sName(target)}] 키링으로 등록 완료! 이제 한 번 더 찍어보세요!`
        );
        setReaderBanner({
          type: 'BOUND_OK',
          student: target,
          uid: boundUid,
          timeMs: Date.now()
        });
      };

      // QR 생성용 베이스 URL 계산
      const isGoogleSandbox =
        window.location.hostname.includes('usercontent.goog') ||
        window.location.hostname.includes('google') ||
        window.location.protocol === 'blob:' ||
        window.location.protocol === 'file:';

      const effectiveBaseUrl = publicSiteUrl.trim()
        ? publicSiteUrl.trim().replace(/\/+$/, '')
        : `${window.location.origin}${window.location.pathname}`;

      const canShowPublicQr = Boolean(sbKey) && (!isGoogleSandbox || Boolean(publicSiteUrl.trim()));

      const buildRoleUrl = (roleType, inviteCodeOpt = '') => {
        let u = `${effectiveBaseUrl}?role=${roleType}&lang=${lang}&sbUrl=${encodeURIComponent(sbUrl)}&sbKey=${encodeURIComponent(sbKey)}`;
        if (inviteCodeOpt) {
          u += `&invite=${encodeURIComponent(inviteCodeOpt)}`;
        }
        return u;
      };

      const popupStudent = useMemo(
        () => students.find((s) => s.id === popupLog?.studentId) || currentStudent,

                      <input
                        type="url"
                        value={publicSiteUrl}
                        onChange={(e) => {
                          setPublicSiteUrl(e.target.value);
                          localStorage.setItem('schooltap_public_url', e.target.value.trim());
                        }}
                        placeholder="https://clinquant-fox-d6e283.netlify.app"
                        className="w-full px-3 py-2 rounded-xl border-2 border-rose-400 bg-white font-mono text-xs"
                      />
                    </div>
                  )}
                </div>

                {canShowPublicQr && (
                  <div className="space-y-4">
                    <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 space-y-3">
                      <div className="text-xs font-black text-amber-950 text-center">
                        {isEn
                          ? '📸 QR links automatically open in US English & hide admin menus on Parent phones!'
                          : '📸 부모님 폰(2번)에서는 관리자 메뉴가 완전히 숨겨지고 초대코드 입력창이 뜹니다!'}
                      </div>
                      <div className="grid grid-cols-2 gap-3 text-center">
                        <div className="bg-white p-3 rounded-2xl border border-slate-200">
                          <div className="text-xs font-black text-slate-900 mb-1">
                            {isEn ? '📲 Phone #1 (Bus Reader)' : '📲 갤럭시 1번 (버스 단말기 전용)'}
                          </div>
                          <div className="text-[10px] text-slate-500 mb-2">
                            {isEn ? 'Auto NFC + Live GPS Kiosk' : '실물 NFC + 실시간 GPS 키오스크'}
                          </div>
                          <img
                            src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(buildRoleUrl('READER'))}`}
                            alt="Reader QR"
                            className="w-36 h-36 mx-auto rounded-lg"
                          />
                          <button
                            onClick={() => {
                              safeCopyText(buildRoleUrl('READER'));
                              showToast(
                                isEn ? 'Copied Bus Reader URL!' : '버스 단말기 전용 링크 복사 완료!'
                              );
                            }}
                            className="mt-2 w-full py-1.5 rounded-lg bg-slate-900 text-white text-[11px] font-bold"
                          >
                            {isEn ? 'Copy Reader Link' : '단말기 링크 복사'}
                          </button>
                        </div>

                        <div className="bg-white p-3 rounded-2xl border-2 border-amber-400">
                          <div className="text-xs font-black text-amber-700 mb-1">
                            {isEn ? '💛 Phone #2 (Parent App)' : '💛 갤럭시 2번 (학부모 앱 공용)'}
                          </div>
                          <div className="text-[10px] text-slate-500 mb-2">
                            {isEn ? 'Invite code login · My child only' : '초대코드 입력 후 내 아이만 표시'}
                          </div>
                          <img
                            src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(buildRoleUrl('PARENT'))}`}
                            alt="Parent QR"
                            className="w-36 h-36 mx-auto rounded-lg"
                          />
                          <button
                            onClick={() => {
                              safeCopyText(buildRoleUrl('PARENT'));
                              showToast(
                                isEn ? 'Copied Parent App URL!' : '학부모 전용 앱 링크 복사 완료!'
                              );
                            }}
                            className="mt-2 w-full py-1.5 rounded-lg bg-amber-400 text-slate-950 text-[11px] font-bold"
                          >
                            {isEn ? 'Copy Parent Link' : '학부모 앱 링크 복사'}
                          </button>
                        </div>
                      </div>
                    </div>

                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5">
                      <div className="text-xs font-black text-slate-900">
                        {isEn
                          ? '💌 1-on-1 Direct Parent Invite QRs (Auto-links child upon scan!)'
                          : '💌 어린이별 1:1 맞춤 학부모 안내장 QR (스캔 즉시 해당 아이 부모님으로 자동 등록!)'}
                      </div>
                      <div className="grid grid-cols-2 gap-2.5">
                        {students.map((s) => (
                          <div key={s.id} className="bg-white p-3 rounded-2xl border border-slate-200 text-center space-y-1.5">
                            <div className="text-xs font-black text-slate-900">
                              {s.avatarEmoji}{' '}
                              {isEn ? `${sName(s)}'s Parent QR` : `${sName(s)} 학부모님 전용 QR`}
                            </div>
                            <div className="text-[10px] font-mono font-bold text-amber-700">
                              {isEn ? 'Code' : '코드'}: {s.inviteCode}
                            </div>
                            <img
                              src={`https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(buildRoleUrl('PARENT', s.inviteCode))}`}
                              alt={sName(s)}
                              className="w-28 h-28 mx-auto rounded-lg"
                            />
                            <button
                              onClick={() => {
                                safeCopyText(buildRoleUrl('PARENT', s.inviteCode));
                                showToast(
                                  isEn
                                    ? `Copied direct parent link for ${sName(s)}!`
                                    : `${sName(s)} 학부모님 전용 직통 링크 복사 완료!`
                                );
                              }}
                              className="w-full py-1 rounded-lg bg-amber-100 text-amber-950 text-[10px] font-black"
                            >
                              {isEn ? `Copy ${sName(s)}'s Link` : `${sName(s)} 부모님 링크 복사`}
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                <button
                  onClick={() => {
                    localStorage.setItem('schooltap_sb_url', sbUrl.trim());
                    localStorage.setItem('schooltap_sb_key', sbKey.trim());
                    setCloudModalOpen(false);
                    showToast(isEn ? '☁️ Cloud settings saved!' : '☁️ 설정 저장 완료!');
                  }}
                  className="w-full py-3 rounded-2xl bg-emerald-600 text-white font-black text-xs"
                >
                  {isEn ? 'Save & Close' : '닫기'}
                </button>
              </div>
            </div>
          )}

          {/* 상단 헤더 */}
          <header className="sticky top-0 z-30 bg-[#FFFDF7]/95 backdrop-blur border-b border-amber-200">
            <div className="max-w-3xl mx-auto px-4 py-3 space-y-2.5">
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <span className="w-9 h-9 rounded-2xl bg-amber-400 flex items-center justify-center text-lg shadow-xs">🚌</span>
                  <div>
                    <h1 className="text-base font-black leading-none">
                      SchoolTap{' '}
                      <span className="text-amber-600">
                        {deviceRole === 'PARENT'
                          ? isEn
                            ? 'Parent App'
                            : '학부모 안심톡'
                          : deviceRole === 'READER'
                          ? isEn
                            ? 'Bus Reader'
                            : '차량 단말기'
                          : isEn
                          ? 'Admin Console'
                          : '원장님 관리콘솔'}
                      </span>
                    </h1>
                    <span
                      onClick={() => setCloudModalOpen(true)}
                      className="text-[11px] text-slate-500 font-bold cursor-pointer underline decoration-dotted"
                    >
                      {deviceRole === 'PARENT'
                        ? cloudStatus === 'CONNECTED'
                          ? isEn
                            ? '🟢 Live Bubble & GPS Alerts Active'
                            : '🟢 실시간 안심 버블 & GPS 알림 켜짐'
                          : cloudStatus === 'ERROR'
                          ? isEn
                            ? '🔴 API Key Error (Tap to Fix)'
                            : '🔴 API 키 오류 (여기를 눌러 키 입력)'
                          : isEn
                          ? '🟡 Tap here to enter API Key'
                          : '🟡 여기를 눌러 API 키 연결'
                        : deviceRole === 'READER'
                        ? isEn
                          ? 'Auto NFC + Live GPS Geofence'
                          : '무인 NFC 스캔 + 실시간 GPS 감시'
                        : isEn
                        ? 'School & Fleet Management Mode'
                        : 'PC / 사업주 통합 관리 모드'}
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-1.5">
                  {deviceRole === 'ADMIN' && (
                    <button
                      onClick={() => setCloudModalOpen(true)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${
                        cloudStatus === 'CONNECTED'
                          ? 'bg-emerald-500 border-emerald-600 text-white'
                          : 'bg-white border-emerald-400 text-emerald-800'
                      }`}
                    >
                      {cloudStatus === 'CONNECTED'
                        ? isEn
                          ? '🟢 QR Center'
                          : '🟢 QR 배포센터'
                        : isEn
                        ? '☁️ Connect Phones'
                        : '☁️ 갤럭시 2대 연결'}
                    </button>
                  )}

                  {deviceRole === 'READER' && (
                    <button
                      onClick={() => setAdminUnlockModalOpen(true)}
                      className="px-2.5 py-1.5 rounded-xl bg-slate-200 text-slate-600 text-[11px] font-bold"
                    >
                      {isEn ? '🔒 Admin' : '🔒 관리자'}
                    </button>
                  )}

                  <button
                    onClick={() => setLang(isEn ? 'ko' : 'en')}
                    className="px-2.5 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-extrabold"
                  >
                    {isEn ? '🇰🇷 KR' : '🇺🇸 US'}
                  </button>
                </div>
              </div>

              {deviceRole === 'ADMIN' && (
                <div className="grid grid-cols-3 gap-1.5">
                  <button
                    onClick={() => setAdminTab('OFFICE')}
                    className={`py-2 rounded-2xl text-xs font-black border ${
                      adminTab === 'OFFICE' ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-slate-200 text-slate-600'
                    }`}
                  >
                    {isEn ? '🏫 Roster & Charms' : '🏫 키링·원생 관리'}
                  </button>
                  <button
                    onClick={() => setAdminTab('READER')}
                    className={`py-2 rounded-2xl text-xs font-black border ${
                      adminTab === 'READER' ? 'bg-slate-900 border-slate-900 text-white' : 'bg-white border-slate-200 text-slate-600'
                    }`}
                  >
                    {isEn ? '📲 Bus Reader View' : '📲 단말기 화면보기'}
                  </button>
                  <button
                    onClick={() => setAdminTab('PARENT_PREVIEW')}
                    className={`py-2 rounded-2xl text-xs font-black border ${
                      adminTab === 'PARENT_PREVIEW' ? 'bg-amber-400 border-amber-500 text-slate-950' : 'bg-white border-slate-200 text-slate-600'
                    }`}
                  >
                    {isEn ? '💛 Parent Preview' : '💛 학부모 미리보기'}
                  </button>
                </div>
              )}
            </div>
          </header>

          {toast && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900 text-white text-xs font-extrabold shadow-xl max-w-sm text-center">
              {toast}
            </div>
          )}

          <main className="max-w-md mx-auto px-4 pt-5">
            {deviceRole === 'PARENT' && renderDedicatedParentView()}
            {deviceRole === 'READER' && renderBusReaderView()}
            {deviceRole === 'ADMIN' && (
              <>
                {adminTab === 'OFFICE' && renderAdminOfficeView()}
                {adminTab === 'READER' && renderBusReaderView()}
                {adminTab === 'PARENT_PREVIEW' && renderDedicatedParentView()}
              </>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
